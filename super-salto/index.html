<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Salto</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2b3a67">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Super Salto">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#e9f2ff;--fg:#17213a;--btn:#2b3a67;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--fg:#e8ecf5;--btn:#4a5fa8}}
:root[data-theme="dark"]{--bg:#10141f;--fg:#e8ecf5;--btn:#4a5fa8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
canvas{width:100%;max-width:820px;height:auto;aspect-ratio:4/3;border-radius:10px;touch-action:none;background:#5ec2ff;display:block}
p{margin:0;font-size:14px;text-align:center;max-width:620px;line-height:1.5}
#pad{display:flex;justify-content:space-between;width:100%;max-width:820px;gap:12px}
#pad div{display:flex;gap:12px}
#pad button{font:700 22px system-ui;background:var(--btn);color:var(--btnfg);border:0;border-radius:14px;min-width:84px;height:68px;padding:0 16px;user-select:none;-webkit-user-select:none;touch-action:none}
#pad button:active{filter:brightness(1.3)}
@media (pointer:fine){#pad{display:none}}

#installbar{width:100%;max-width:820px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#installbar strong{font-size:18px}
#installbar span{font-size:12px;opacity:.72}
#installbar button{border:0;border-radius:999px;background:var(--btn);color:var(--btnfg);font:800 14px system-ui;padding:10px 14px}
@media (display-mode:standalone){#installbar button{display:none}}
</style></head>
<body>
<div id="installbar"><div><strong>SUPER SALTO</strong><br><span id="pwaStatus">Listo para jugar</span></div><button id="installPwa" type="button">INSTALAR</button></div>
<canvas id="c" width="640" height="480"></canvas>
<p>Flechas o A/D para moverte, Espacio o ↑ para saltar. Salta sobre los enemigos y golpea los bloques ? desde abajo.</p>
<div id="pad"><div><button data-k="left">◀</button><button data-k="right">▶</button></div><button data-k="jump">SALTAR</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const T=32,W=640,H=480,COLS=100,ROWS=15;
let grid,coins,enemies,pops,P,cam=0,score,lives,coinsC,state='start',t=0,cp=2,bumped=[];
const keys={};
let AC;function beep(f,d=.1,ty='square'){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),n=AC.createGain();o.type=ty;o.frequency.value=f;n.gain.value=.04;o.connect(n);n.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

function build(){
 grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
 const gaps=[[22,24],[40,43],[58,60],[72,75]];
 for(let c=0;c<COLS;c++){if(gaps.some(([a,b])=>c>=a&&c<b))continue;grid[13][c]=1;grid[14][c]=1}
 const br=[[10,9,5],[18,9,3],[28,8,4],[34,6,3],[46,9,4],[52,7,3],[64,9,5],[80,8,4]];
 br.forEach(([c,r,n])=>{for(let i=0;i<n;i++)grid[r][c+i]=2});
 [[12,9],[20,9],[30,8],[35,6],[48,9],[53,7],[66,9],[82,8]].forEach(([c,r])=>grid[r][c]=3);
 [[16,2],[37,3],[55,2],[68,3]].forEach(([c,h])=>{for(let i=0;i<h;i++){grid[12-i][c]=5;grid[12-i][c+1]=5}});
 for(let i=0;i<6;i++)for(let h=0;h<=i;h++)grid[12-h][90+i]=1;
 coins=[];
 br.forEach(([c,r,n])=>{for(let i=0;i<n;i++)if(grid[r][c+i]!==3||i%2)coins.push({x:(c+i)*T+16,y:(r-1)*T+16,got:0})});
 [[22.5],[23.5],[41],[42],[58.5],[59.5],[73],[74]].forEach(([c],i)=>coins.push({x:c*T+16,y:(10-(i%2?0:1))*T,got:0}));
 enemies=[14,26,33,45,50,62,70,78,86].map(c=>({x:c*T,y:13*T-26,w:28,h:26,vx:-1,vy:0,dead:0,on:false}));
 pops=[];respawn(2);cp=2;cam=0;
}
function respawn(c){P={x:c*T,y:13*T-31,w:22,h:30,vx:0,vy:0,on:false,dir:1,inv:100}}
const sol=(x,y)=>{const c=Math.floor(x/T),r=Math.floor(y/T);if(c<0||c>=COLS)return true;if(r<0||r>=ROWS)return false;return grid[r][c]>0};

function move(o,isP){
 let hx=false;
 o.x+=o.vx;
 const xs=o.vx>0?o.x+o.w:o.x;
 if(o.vx!==0&&[o.y+2,o.y+o.h/2,o.y+o.h-2].some(y=>sol(xs,y))){
  o.x=o.vx>0?Math.floor(xs/T)*T-o.w-.01:(Math.floor(xs/T)+1)*T+.01;hx=true;if(isP)o.vx=0}
 o.y+=o.vy;o.on=false;
 const px=[o.x+3,o.x+o.w-3];
 if(o.vy>=0){const ye=o.y+o.h;if(px.some(x=>sol(x,ye))){o.y=Math.floor(ye/T)*T-o.h-.01;o.vy=0;o.on=true}}
 else if(px.some(x=>sol(x,o.y))){
  if(isP)px.forEach(x=>{if(sol(x,o.y))bumped.push([Math.floor(x/T),Math.floor(o.y/T)])});
  o.y=(Math.floor(o.y/T)+1)*T+.01;o.vy=0}
 return hx;
}
function hurt(){
 lives--;beep(150,.4,'sawtooth');
 if(lives<=0){state='over';return}
 respawn(cp);
}
function update(){
 t++;if(state!=='play')return;
 const a=(keys.right?1:0)-(keys.left?1:0);
 if(a){P.vx+=a*.55;P.dir=a}else P.vx*=.8;
 P.vx=Math.max(-4.4,Math.min(4.4,P.vx));if(Math.abs(P.vx)<.05)P.vx=0;
 if(keys.jump&&P.on){P.vy=-11.8;beep(520,.12)}
 if(!keys.jump&&P.vy<-4)P.vy=-4;
 P.vy=Math.min(P.vy+.55,12);
 bumped=[];move(P,true);
 bumped.forEach(([c,r])=>{if(grid[r]&&grid[r][c]===3){grid[r][c]=4;score+=50;coinsC++;pops.push({x:c*T+16,y:r*T,t:0});beep(880,.15)}});
 if(P.inv>0)P.inv--;
 [2,20,45,62,78,86].forEach(c=>{if(P.on&&P.x>=c*T)cp=c});
 if(P.y>H+60)hurt();
 coins.forEach(c=>{if(!c.got&&Math.abs(P.x+P.w/2-c.x)<20&&Math.abs(P.y+P.h/2-c.y)<24){c.got=1;score+=10;coinsC++;beep(990,.08)}});
 enemies.forEach(e=>{
  if(e.dead){e.dead--;return}
  if(Math.abs(e.x-P.x)>700||e.y>H+80)return;
  e.vy=Math.min(e.vy+.55,12);if(move(e,false))e.vx=-e.vx;
  if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){
   if(P.vy>0&&P.y+P.h-P.vy<=e.y+12){e.dead=25;P.vy=-8;score+=100;beep(300,.12)}
   else if(P.inv<=0)hurt();
  }
 });
 pops.forEach(p=>p.t++);pops=pops.filter(p=>p.t<30);
 if(P.x>98*T){state='win';beep(660,.4)}
 cam=Math.max(0,Math.min(COLS*T-W,P.x-W/3));
}

function draw(){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#4fb6f7');gr.addColorStop(1,'#d9f2ff');
 g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='#8fd87c';
 for(let i=0;i<10;i++){const hx=((i*380-cam*.5)%3800+3800)%3800-200;g.beginPath();g.ellipse(hx,13*T,110+(i%3)*30,70+(i%2)*30,0,Math.PI,0);g.fill()}
 g.fillStyle='#fff';
 for(let i=0;i<8;i++){const cx=((i*300-cam*.3)%2400+2400)%2400-150,cy=50+(i*47)%100;
  [[0,0,26],[28,6,20],[-28,8,18]].forEach(([dx,dy,r])=>{g.beginPath();g.arc(cx+dx,cy+dy,r,0,7);g.fill()})}
 const c0=Math.floor(cam/T),c1=Math.min(COLS-1,c0+21);
 for(let r=0;r<ROWS;r++)for(let c=c0;c<=c1;c++){
  const v=grid[r][c];if(!v)continue;const x=c*T-cam,y=r*T;
  if(v===1){g.fillStyle='#8b5a2b';g.fillRect(x,y,T,T);if(!grid[r-1]||!grid[r-1][c]){g.fillStyle='#4caf50';g.fillRect(x,y,T,8)}g.fillStyle='rgba(0,0,0,.12)';g.fillRect(x+6,y+16,6,6)}
  else if(v===2){g.fillStyle='#c4623a';g.fillRect(x,y,T,T);g.fillStyle='#8f3f20';g.fillRect(x,y+15,T,2);g.fillRect(x+15,y,2,15);g.fillRect(x+7,y+17,2,15);g.fillRect(x+23,y+17,2,15)}
  else if(v===3){g.fillStyle='#f5b82e';g.fillRect(x,y,T,T);g.strokeStyle='#a56b00';g.lineWidth=2;g.strokeRect(x+1,y+1,T-2,T-2);g.fillStyle='#7a4b00';g.font='bold 22px system-ui';g.textAlign='center';g.fillText('?',x+16,y+24+Math.sin(t/12)*1)}
  else if(v===4){g.fillStyle='#8c7b6b';g.fillRect(x,y,T,T);g.strokeStyle='#5f5246';g.lineWidth=2;g.strokeRect(x+1,y+1,T-2,T-2)}
  else if(v===5){const cap=!grid[r-1]||grid[r-1][c]!==5,left=grid[r][c-1]!==5;g.fillStyle='#2fa84f';g.fillRect(x,y,T,T);g.fillStyle='#1d7a36';g.fillRect(left?x:x+T-6,y,6,T);g.fillStyle='#6fe08a';g.fillRect(left?x+8:x+14,y,5,T);if(cap){g.fillStyle='#2fa84f';g.fillRect(x-(left?3:0),y,T+3,12);g.strokeStyle='#1d7a36';g.strokeRect(x-(left?3:0),y,T+3,12)}}
 }
 // bandera
 const fx=98*T-cam;g.fillStyle='#e8e8ee';g.fillRect(fx+14,3*T,4,10*T);g.fillStyle='#ff4d6d';g.beginPath();g.moveTo(fx+18,3*T+4);g.lineTo(fx+50,3*T+20);g.lineTo(fx+18,3*T+36);g.fill();
 g.fillStyle='#ffd23f';g.beginPath();g.arc(fx+16,3*T-4,6,0,7);g.fill();
 coins.forEach(c=>{if(c.got)return;const w=Math.abs(Math.cos(t/14+c.x))*6+2;g.fillStyle='#ffd23f';g.beginPath();g.ellipse(c.x-cam,c.y,w,9,0,0,7);g.fill();g.strokeStyle='#c99500';g.stroke()});
 pops.forEach(p=>{g.fillStyle='#ffd23f';g.beginPath();g.arc(p.x-cam,p.y-p.t*2,8,0,7);g.fill()});
 enemies.forEach(e=>{
  const x=e.x-cam;if(x<-40||x>W+40||e.y>H)return;
  if(e.dead){g.fillStyle='#7d4fc4';g.fillRect(x,e.y+e.h-8,e.w,8);return}
  g.fillStyle='#7d4fc4';g.beginPath();g.ellipse(x+14,e.y+12,14,12,0,Math.PI,0);g.fill();g.fillRect(x,e.y+12,28,8);
  g.fillStyle='#fff';g.fillRect(x+6,e.y+7,6,7);g.fillRect(x+16,e.y+7,6,7);g.fillStyle='#111';g.fillRect(x+8+(e.vx>0?2:0),e.y+10,3,4);g.fillRect(x+18+(e.vx>0?2:0),e.y+10,3,4);
  g.fillStyle='#4a2a85';const s=Math.floor(t/10)%2;g.fillRect(x+(s?2:5),e.y+20,8,6);g.fillRect(x+(s?16:13),e.y+20,8,6);
 });
 if(!(P.inv>0&&Math.floor(t/4)%2)){
  const x=P.x-cam,y=P.y,d=P.dir;
  g.fillStyle='#2b6fd6';g.fillRect(x+2,y+16,18,10);g.fillStyle='#e8553d';g.fillRect(x+2,y+14,18,6);
  g.fillStyle='#f2c18d';g.fillRect(x+3,y+4,16,11);
  g.fillStyle='#14b8a6';g.fillRect(x+1,y,20,6);g.fillRect(d>0?x+14:x-3,y+4,10,3);
  g.fillStyle='#111';g.fillRect(d>0?x+13:x+6,y+8,3,4);
  g.fillStyle='#3a2a1a';const w=P.on&&Math.abs(P.vx)>.5?Math.floor(t/6)%2*3:0;
  g.fillRect(x+1-w,y+26,9,4);g.fillRect(x+12+w,y+26,9,4);
 }
 g.textAlign='left';g.font='bold 18px system-ui';g.fillStyle='#10213f';
 g.fillText('Puntos '+score+'   Monedas '+coinsC+'   Vidas '+lives,14,26);
 if(state!=='play'){
  g.fillStyle='rgba(10,16,40,.72)';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';
  const m={start:['Super Salto','Llega a la bandera y junta monedas','Toca la pantalla o pulsa Espacio para jugar'],
   win:['¡Nivel completado!','Puntos: '+score+' · Monedas: '+coinsC,'Toca o pulsa Espacio para jugar otra vez'],
   over:['Fin del juego','Puntos: '+score,'Toca o pulsa Espacio para reintentar']}[state];
  g.font='bold 44px system-ui';g.fillText(m[0],W/2,200);g.font='20px system-ui';g.fillText(m[1],W/2,245);g.font='bold 18px system-ui';g.fillStyle='#ffd23f';g.fillText(m[2],W/2,300);
 }
}

function start(){if(state==='play')return;score=0;lives=3;coinsC=0;build();state='play'}
const map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',w:'jump',W:'jump',' ':'jump'};
addEventListener('keydown',e=>{const k=map[e.key];if(k){e.preventDefault();keys[k]=true;start()}});
addEventListener('keyup',e=>{const k=map[e.key];if(k)keys[k]=false});
cv.addEventListener('pointerdown',start);
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;start()});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
score=0;lives=3;coinsC=0;build();
let last=0,acc=0;
function loop(ts){acc+=Math.min(ts-last,100);last=ts;while(acc>=16.667){update();acc-=16.667}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
<script>
let installPrompt=null;
const installPwa=document.getElementById('installPwa');
const pwaStatus=document.getElementById('pwaStatus');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;});
installPwa.addEventListener('click',async()=>{
  if(installPrompt){
    installPrompt.prompt();
    try{await installPrompt.userChoice}catch(e){}
    installPrompt=null;
  }else{
    pwaStatus.textContent='iPhone: Compartir → Añadir a pantalla de inicio';
  }
});
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
</body></html>
