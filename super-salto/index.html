function gen(i,a){

function move(o,isP){
 let hx=false;

 const xs=o.vx>0?o.x+o.w:o.x;

 }
 warps.forEach(w=>{let r=0;while(grid[r][w]!==5)r++;const x=(w+1)*T-cam,y=r*T-16+Math.sin(t/8)*3;if(x>-40&&x<W+40){g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=2;g.beginPath();g.moveTo(x-8,y-8);g.lineTo(x+8,y-8);g.lineTo(x,y+4);g.closePath();g.fill();g.stroke()}});
 // bandera

 coins.forEach(c=>{if(c.got)return;const w=Math.abs(Math.cos(t/14+c.x))*6+2;g.fillStyle='#ffd23f';g.beginPath();g.ellipse(c.x-cam,c.y,w,9,0,0,7);g.fill();g.strokeStyle='#c99500';g.stroke()});
